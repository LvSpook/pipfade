<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="pipfade - a see-through mini player for Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="55%" stop-color="#0c0c0d"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <!-- The mark, in the app's own blend: solid, then 80%, then 27% at the
         right edge. The same three stops `Mark.PaintFrame` uses, so the banner
         and the taskbar icon are recognisably the same object. -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.804"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.275"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbcbd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- Everything is clipped to the same rounded rectangle the border draws.
         Without this the square background fill ran out past the corner arc,
         which left four sharp points on an otherwise rounded picture at any
         size smaller than the one the numbers were picked at. -->
    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="320" rx="19" ry="19"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- three hairlines: a hint of a screen, nothing that competes -->
    <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
      <path d="M0 80h1200M0 160h1200M0 240h1200"/>
    </g>
  </g>

  <g transform="translate(199 101)">
    <!-- a whisper behind the stroke, so the frame sits on the surface -->
    <rect x="0" y="0" width="200" height="118" rx="39" ry="39"
          fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="24"
          filter="url(#soft)"/>
    <rect x="0" y="0" width="200" height="118" rx="39" ry="39"
          fill="none" stroke="url(#frame)" stroke-width="13.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(461 0)">
    <text x="0" y="152"
          font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="80" font-weight="700" fill="url(#word)"
          letter-spacing="-2.2">pipfade</text>

    <text x="2" y="197"
          font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="20.5" fill="#93939a"
          letter-spacing="0.1">A see-through mini player for Brave, Chrome and Edge</text>

    <g transform="translate(2 226)"
       font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif"
       font-size="12.5" font-weight="600" letter-spacing="0.5">
      <rect x="0" y="-16" width="104" height="27" rx="13.5"
            fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.17"/>
      <text x="52" y="2.5" text-anchor="middle" fill="#d2d2d7">PowerShell</text>

      <rect x="116" y="-16" width="100" height="27" rx="13.5"
            fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.17"/>
      <text x="166" y="2.5" text-anchor="middle" fill="#d2d2d7">Windows</text>

      <rect x="228" y="-16" width="104" height="27" rx="13.5"
            fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.17"/>
      <text x="280" y="2.5" text-anchor="middle" fill="#d2d2d7">No install</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
</svg>
